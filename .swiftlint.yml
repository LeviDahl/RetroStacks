# SwiftLint config for the RetroStacks app target (apple/). Run via
# Scripts/lint.sh — deliberately *not* wired into an Xcode Build Phase
# (that would mean editing project.pbxproj, off-limits per CLAUDE.md's
# guardrails) or an SPM plugin (would add a package dependency, same
# problem). `brew install swiftlint` gives you the `swiftlint` binary this
# config file is discovered by automatically.

included:
  - apple/RetroStacks
  - apple/RetroStacksTests
  - apple/RetroStacksUITests

excluded:
  - apple/RetroStacks/Assets.xcassets
  - apple/RetroStacks/Resources
  - apple/RetroStacksTests/Fixtures

# Opt-in rules worth having on top of SwiftLint's default set — matched to
# the "code smells worth watching for" from BACKLOG.md's Code health section
# (force unwraps and swallowed errors are exactly what hid the userID bug).
# `force_try`/`empty_count`/`redundant_type_annotation` are already default
# rules — listed here only where they needed opting in.
opt_in_rules:
  - force_unwrapping
  - redundant_optional_initialization
  - closure_end_indentation

# unused_import / unused_declaration only run under `swiftlint analyze`
# (needs a compile log, not just `swiftlint lint`) — left out of this config
# on purpose; run `swiftlint analyze` manually if that's ever worth doing.

# Not blanket-disabling anything else — the point of a first pass is to see
# what the default rule set actually finds, not to pre-guess which ones will
# be noisy for this codebase.

line_length:
  warning: 160
  error: 220

identifier_name:
  # First real run flagged ~90 short-closure-param names (m, v, q, i, s...) —
  # that's this codebase's idiom throughout (`{ m in ... }`,
  # `.first { $0.slug == slug }`-style scratch vars), not a smell. Disabling
  # the length floor keeps the rule active for the things that *are* still
  # worth catching (leading underscores, non-lowerCamelCase).
  min_length: 0

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 600
  error: 900
